modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/dmitriitimoshenko/ic2c-autocrafter/issues"

[[mods]]
modId="${mod_id}"
displayURL="https://github.com/dmitriitimoshenko/ic2c-autocrafter"
logoFile="logo.png"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ic2"
    mandatory=true
    versionRange="[1.19.2-2.1.3.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="carbonconfig"
    mandatory=true
    versionRange="[1.19.2-2.0.0,)"
    ordering="AFTER"
    side="BOTH"
